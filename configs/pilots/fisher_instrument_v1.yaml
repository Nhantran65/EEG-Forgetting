schema_version: 1
id: fisher_instrument_v1
status: instrument_pilot
datasets: [bciciv2a, physionet_mi, sleep_edf_sc]
manifest_version: v3
model_seed: 3407
checkpoint_role: exact_step_2500_final
parameters:
  scope: shared_plastic_backbone_only
  final_encoder_blocks: 4
  exclude_task_head: true
estimator:
  name: diagonal_empirical_fisher
  target: observed_label_negative_log_likelihood
  gradient_unit: individual_example
  implementation: standard_backward_per_example
  model_mode: eval
  sample_count: 1024
  sampling: uniform_without_replacement_from_training_manifest
  sampling_seed: 3407
  split_half_samples: 512
  gradient_microbatch_size: 1
normalization:
  primary: l2_within_encoder_layer
  purpose: equal_layer_weight_in_cosine
overlap:
  primary: cosine
instrument_gate:
  minimum_split_half_cosine: 0.90
  minimum_margin_above_max_cross_task_cosine: 0.05
  if_failed: double_sample_count_to_2048_and_repeat_before_cl_scale_up
notes:
  - The pilot uses the natural training distribution; class-balanced Fisher is only a sensitivity analysis.
  - Split halves are disjoint subsets from one deterministic 1024-example sample.
  - Microbatch size affects only memory and runtime; one preserves the same exact per-example estimator on shared GPUs.
  - Top-k Jaccard is not selected from this pilot and remains disabled until k is predeclared.
