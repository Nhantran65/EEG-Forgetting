schema_version: 1
id: sequential_ft_bci_robustness_v2
status: locked_main
method: sequential_finetuning
seeds: [3407, 42, 2026]
canonical_tasks: [bciciv2a, physionet_mi, sleep_edf_sc]
orders:
  forward: [bciciv2a, physionet_mi, sleep_edf_sc]
  reverse: [sleep_edf_sc, physionet_mi, bciciv2a]
  challenging: [physionet_mi, bciciv2a, sleep_edf_sc]
cache_roots:
  bciciv2a: data/processed/v4-bci-robustness
  physionet_mi: data/processed/v3
  sleep_edf_sc: data/processed/v3
manifests:
  bciciv2a: manifests/v4-bci-robustness/manifest-set.json
  physionet_mi: manifests/v3/manifest-set.json
  sleep_edf_sc: manifests/v3/manifest-set.json
model:
  head: flatten_mlp
  head_initialization: preinitialize_all_in_canonical_task_order
  plastic_final_encoder_blocks: 4
  frozen_backbone_mode: eval
training:
  train_split: train
  evaluation_split: test
  optimizer_steps_per_task: 2500
  batch_size: 64
  optimizer: AdamW
  optimizer_reset_each_task: true
  backbone_learning_rate: 0.0001
  current_head_learning_rate: 0.0005
  weight_decay: 0.05
  gradient_clip_norm: 1.0
  label_smoothing: 0.1
  schedule: cosine_annealing
  minimum_learning_rate: 0.000001
  progress_interval_steps: 100
evaluation:
  primary: mean_subject_balanced_accuracy
  save_predictions: true
  evaluate_seen_tasks_after_each_stage: true
forgetting:
  minimum_valid_headroom_above_chance: 0.05
  invalid_action: retain_raw_and_flag_relative_null_without_clipping
analysis_gate:
  compare_direction_sign_to_main: true
  fail_if_all_bci_involving_directions_reverse: true
recovery:
  checkpoint_after_each_task: true
  resume_only_from_digest_verified_complete_stage: true
purpose: bci_subject_split_robustness_without_hyperparameter_retuning
