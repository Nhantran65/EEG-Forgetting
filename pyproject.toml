[project]
name = "eeg-forgetting"
version = "0.1.0"
description = "Reproducible continual-learning diagnostics for EEG foundation models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mne>=1.10,<2",
    "numpy>=2,<3",
    "pyyaml>=6,<7",
    "scipy>=1.16,<2",
    "xlrd>=2,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
